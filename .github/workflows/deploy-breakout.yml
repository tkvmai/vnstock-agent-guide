name: Deploy Breakout Screener

# Push lên main có thay đổi trong breakout_app/ → SSH vào server chạy deploy.sh
# (pull code + cài deps nếu đổi + restart service). Dữ liệu runtime trên server
# nằm trong .gitignore nên deploy không bao giờ đụng tới.
on:
  push:
    branches: [main]
    paths:
      - "breakout_app/**"
      - ".github/workflows/deploy-breakout.yml"
  workflow_dispatch: {}        # cho phép bấm chạy tay từ tab Actions

concurrency:
  group: deploy-breakout
  cancel-in-progress: false    # deploy tuần tự, không chen ngang

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: bash ~/vnstock-agent-guide/breakout_app/deploy.sh
